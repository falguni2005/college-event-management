{% extends "base.html" %}{% block title %}Create Student Account{% endblock %}{% block content %}<div class="auth-card mx-auto"><h1 class="h3">Create Student Account</h1><p class="text-secondary">Register once to browse and join college events.</p><form method="post"><label class="form-label">Full name</label><input class="form-control mb-3" name="name" required maxlength="120"><label class="form-label">College email</label><input class="form-control mb-3" type="email" name="email" required><label class="form-label">Department</label><select class="form-select mb-3" name="department" required><option value="">Choose department</option>{% for d in departments if d != 'Open to All' %}<option>{{ d }}</option>{% endfor %}</select><label class="form-label">Password (minimum 8 characters)</label><input class="form-control mb-3" type="password" name="password" minlength="8" required><label class="form-label">Confirm password</label><input class="form-control mb-3" type="password" name="confirm_password" minlength="8" required><button class="btn btn-primary w-100">Create Account</button></form><p class="mt-3 mb-0">Already registered? <a href="{{ url_for('student_login') }}">Student login</a></p></div>{% endblock %}
